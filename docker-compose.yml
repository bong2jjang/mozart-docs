services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mozart-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./backend/qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - mozart-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mozart-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - mozart-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    image: mozart-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mozart-backend
    ports:
      - "8000:8000"
    volumes:
      - ./docs:/app/docs:ro
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - DOCS_PATH=/app/docs/docs
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
    env_file:
      - ./backend/.env
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mozart-network

  # Frontend Docs (production build with search index)
  frontend:
    image: mozart-frontend:latest
    build:
      context: ./docs
      dockerfile: Dockerfile
    container_name: mozart-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mozart-network

networks:
  mozart-network:
    driver: bridge
